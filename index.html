<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6efdf" />
    <title>Crayon melt</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="paper" aria-label="Crayon drawing area">
      <canvas id="drawing" aria-label="Draw with a crayon; strokes melt after two seconds"></canvas>
      <p class="hint">Draw something. Wait two seconds.</p>
      <button id="clear" class="clear" type="button">Clear</button>
      <div class="palette" role="group" aria-label="Crayon color">
        <button class="crayon selected" type="button" data-color="#ed654f" aria-label="Coral" aria-pressed="true" style="--crayon:#ed654f"></button>
        <button class="crayon" type="button" data-color="#e8a646" aria-label="Marigold" aria-pressed="false" style="--crayon:#e8a646"></button>
        <button class="crayon" type="button" data-color="#7a9e74" aria-label="Sage" aria-pressed="false" style="--crayon:#7a9e74"></button>
        <button class="crayon" type="button" data-color="#69a9b5" aria-label="Pool blue" aria-pressed="false" style="--crayon:#69a9b5"></button>
        <button class="crayon" type="button" data-color="#a68dbb" aria-label="Lilac" aria-pressed="false" style="--crayon:#a68dbb"></button>
        <button class="crayon" type="button" data-color="#524b54" aria-label="Charcoal" aria-pressed="false" style="--crayon:#524b54"></button>
      </div>
      <span id="status" class="sr-only" role="status">Ready to draw</span>
    </main>
  </body>
</html>
