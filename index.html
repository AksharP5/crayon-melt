<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6efdf" />
    <title>Crayon melt</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="paper" aria-label="Crayon drawing area">
      <canvas id="drawing" tabindex="0" aria-label="Draw with a crayon; strokes melt after two seconds. Select Move canvas to pan."></canvas>
      <div class="zoom-controls" role="group" aria-label="Canvas zoom">
        <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
        <button id="zoom-level" type="button" aria-label="Reset zoom to 100%" title="Reset zoom to 100%">100%</button>
        <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      </div>
      <button id="clear" class="clear" type="button">Clear</button>
      <div class="controls">
        <div class="sliders">
          <label class="size-control" for="size">Size <input id="size" type="range" min="5" max="32" value="13" aria-label="Crayon size" /></label>
          <label class="melt-control" for="melt">Melt <input id="melt" type="range" min="0" max="100" value="50" aria-label="Melt amount" /><output id="melt-value" for="melt">50%</output></label>
        </div>
        <div class="tool-row">
          <div class="palette" role="group" aria-label="Crayon colors">
            <button class="crayon selected" type="button" data-color="#ed654f" aria-label="Coral" aria-pressed="true" style="--crayon:#ed654f"></button>
            <button class="crayon" type="button" data-color="#d87898" aria-label="Rose" aria-pressed="false" style="--crayon:#d87898"></button>
            <button class="crayon" type="button" data-color="#df8952" aria-label="Tangerine" aria-pressed="false" style="--crayon:#df8952"></button>
            <button class="crayon" type="button" data-color="#e8a646" aria-label="Marigold" aria-pressed="false" style="--crayon:#e8a646"></button>
            <button class="crayon" type="button" data-color="#c8b958" aria-label="Citron" aria-pressed="false" style="--crayon:#c8b958"></button>
            <button class="crayon" type="button" data-color="#7a9e74" aria-label="Sage" aria-pressed="false" style="--crayon:#7a9e74"></button>
            <button class="crayon" type="button" data-color="#4e9e91" aria-label="Teal" aria-pressed="false" style="--crayon:#4e9e91"></button>
            <button class="crayon" type="button" data-color="#69a9b5" aria-label="Pool blue" aria-pressed="false" style="--crayon:#69a9b5"></button>
            <button class="crayon" type="button" data-color="#657fb7" aria-label="Cobalt" aria-pressed="false" style="--crayon:#657fb7"></button>
            <button class="crayon" type="button" data-color="#a68dbb" aria-label="Lilac" aria-pressed="false" style="--crayon:#a68dbb"></button>
            <button class="crayon" type="button" data-color="#524b54" aria-label="Charcoal" aria-pressed="false" style="--crayon:#524b54"></button>
            <div class="color-picker">
              <button id="custom-color" class="custom-color" type="button" aria-label="Custom color" aria-pressed="false" aria-expanded="false" aria-controls="color-menu" title="Custom color"><span aria-hidden="true">+</span></button>
              <div id="color-menu" class="color-menu" hidden>
                <div class="color-menu-heading">Custom color <output id="color-value"></output></div>
                <div id="hue-wheel" class="hue-wheel" role="slider" tabindex="0" aria-label="Hue" aria-valuemin="0" aria-valuemax="359"><span id="hue-marker" aria-hidden="true"></span></div>
                <div id="shade-field" class="shade-field" tabindex="0" aria-label="Saturation and brightness"><span id="shade-marker" aria-hidden="true"></span></div>
              </div>
            </div>
          </div>
          <div class="tool-actions" role="group" aria-label="Canvas tools">
            <div class="eraser-picker">
              <button id="eraser" class="tool-button" type="button" aria-label="Choose eraser" aria-pressed="false" aria-expanded="false" aria-controls="eraser-menu" title="Choose eraser"><span class="eraser-icon" aria-hidden="true"></span></button>
              <div id="eraser-menu" class="eraser-menu" role="group" aria-label="Eraser mode" hidden>
                <button type="button" data-tool="all" aria-pressed="false">General</button>
                <button type="button" data-tool="mark" aria-pressed="false">Marks only</button>
                <button type="button" data-tool="drip" aria-pressed="false">Drips only</button>
              </div>
            </div>
            <button id="move" class="tool-button" type="button" aria-label="Move canvas" aria-pressed="false" title="Move canvas"><span class="move-icon" aria-hidden="true"></span></button>
          </div>
        </div>
      </div>
      <span id="brush-preview" aria-hidden="true"></span>
      <span id="status" class="sr-only" role="status">Ready to draw</span>
    </main>
  </body>
</html>
